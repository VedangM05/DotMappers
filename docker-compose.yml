services:
  backend:
    build: .
    container_name: dotmappers_backend
    ports:
      - "8080:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - LLM_PROVIDER=auto
    volumes:
      - ./support_tickets.csv:/app/support_tickets.csv
      - ./support_tickets.db:/app/support_tickets.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: .
    container_name: dotmappers_frontend
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_CLIENT_SHOWERRORDETAILS=false
    command: streamlit run app.py --logger.level=error
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
