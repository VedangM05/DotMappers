version: '3.8'

services:
  backend:
    build: .
    container_name: dotmappers_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - LLM_PROVIDER=auto
    volumes:
      - ./support_tickets.csv:/app/support_tickets.csv
      - ./support_tickets.db:/app/support_tickets.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:23-alpine
    container_name: dotmappers_frontend
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
