version: '3.8'

services:
  # Supabase PostgreSQL + pgvector Database Service
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: dotmappers_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/20260916_init_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend REST API & Streamlit Dashboard Service
  app:
    build: .
    container_name: dotmappers_ai_app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - POSTGRES_DB_URL=postgresql://postgres:postgrespassword@postgres:5432/postgres
      - API_PORT=8000
      - UI_PORT=8501
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
